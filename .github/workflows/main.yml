
name: Download PHP 8.4.27 FPM Image

on:
  workflow_dispatch:

jobs:
  download-and-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Pull and Verify Image
        run: |
          set -euo pipefail

          IMAGE="php:8.4.27-fpm-bookworm"

          docker pull --platform linux/amd64 "$IMAGE"

          docker run --rm \
            --platform linux/amd64 \
            "$IMAGE" php -v

      - name: Save and Compress Image
        run: |
          docker save php:8.4.27-fpm-bookworm \
            | gzip -1 > php-fpm_8.4.27_amd64.tar.gz

          ls -lh php-fpm_8.4.27_amd64.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-fpm-8.4.27-amd64
          path: php-fpm_8.4.27_amd64.tar.gz
          retention-days: 1
          if-no-files-found: error
