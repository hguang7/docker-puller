name: Download Docker Image
on: [workflow_dispatch] # 手动触发开关

jobs:
  download-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Save Image
        run: |
          # 拉取你需要的镜像
          docker pull bitnami/php-fpm:8.4.27
          # 导出为 tar 文件
          docker save bitnami/php-fpm:8.4.27 -o php-fpm_8.4.27.tar
          # 压缩一下，减少网页下载体积
          gzip php-fpm_8.4.27.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-fpm_8.4.27-tar-gz
          path: php-fpm_8.4.27.tar.gz
          retention-days: 1 # 下载完就失效，保护隐私
