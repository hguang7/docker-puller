[www]
listen = 9000
user = daemon
group = daemon
pm = dynamic
pm.max_children = 150
pm.start_servers = 10
pm.min_spare_servers = 10
pm.max_spare_servers = 30
pm.status_path = /status
request_slowlog_timeout = 2s
slowlog = /var/www/html/logs/php-fpm-slow.log
catch_workers_output = yes
php_admin_flag[log_errors] = on
